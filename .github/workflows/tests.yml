# Runs the full test suite on Linux (like the Vercel runtime) for every push and pull request.
# Free for public repositories on GitHub-hosted runners. Makes no network calls to arXiv:
# all tests use saved responses and generated PDFs.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install the browser used by the UI tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q
